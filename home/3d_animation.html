<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple 3D Cube Animation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            height: 100vh;
            background: #0d0d2b;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .perspective {
            perspective: 600px;
            transform-style: preserve-3d;
        }
        .cube {
            width: 180px;
            height: 180px;
            position: relative;
            animation: spin 12s linear infinite;
        }
        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #fff;
            font-weight: 600;
        }
        .front  { background: linear-gradient(135deg, #667eea, #764ba2); }
        .back   { background: linear-gradient(135deg, #f093fb, #f5576c); transform: rotateY(180deg); }
        .left   { background: linear-gradient(135deg, #43cea2, #185a9d); transform: rotateY(-90deg); }
        .right  { background: linear-gradient(135deg, #fa709a, #fee140); transform: rotateY(90deg); }
        .top    { background: linear-gradient(135deg, #43cea2, #185a9d); transform: rotateX(90deg); }
        .bottom { background: linear-gradient(135deg, #fa709a, #fee140); transform: rotateX(-90deg); }
        @keyframes spin {
            from { transform: rotateX(0) rotateY(0); }
            to { transform: rotateX(360deg) rotateY(360deg); }
        }
    </style>
</head>
<body>
    <div class="perspective">
        <div class="cube">
            <div class="face front">Front</div>
            <div class="face back">Back</div>
            <div class="face left">Left</div>
            <div class="face right">Right</div>
            <div class="face top">Top</div>
            <div class="face bottom">Bottom</div>
        </div>
    </div>
</body>
</html>
